name: shinkibus-watch

on:
  schedule:
    # 21:37 UTC = 06:37 JST（出勤前に届く時刻）
    # GitHub の cron は数分〜十数分遅延することがあるので余裕をみている
    - cron: "37 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shinkibus-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check 神姫バス news
        env:
          # Discord に飛ばす場合のみ設定（未設定ならログにスキップと出る）
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # メールで受け取る場合のみ設定（未設定ならログにスキップと出る）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # 例: https://<user>.github.io/shinkibus-watch/feed.xml
          FEED_SELF_URL: ${{ vars.FEED_SELF_URL }}
          # 既定は絞り込みなし（全件通知）。多すぎる場合だけカンマ区切りで指定する
          KEYWORDS: ${{ vars.KEYWORDS }}
          # 1 にすると新着の有無に関係なくダミー通知を1件送って終了する
          TEST_NOTIFY: ${{ vars.TEST_NOTIFY }}
        run: python watch.py

      - name: Commit state and feed
        # 通知に失敗しても state/feed の保存はしたいので always()
        if: always() && steps.check.conclusion != 'skipped'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state.json feed.xml || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update state and feed [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
